<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Preview</title>
    <style>
      @page {
        size: 60mm 30mm;
        margin: 0;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #111;
      }

      .toolbar {
        position: sticky;
        top: 0;
        padding: 10px 14px;
        background: #111827;
        color: #fff;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .toolbar-title {
        font-size: 14px;
        font-weight: 700;
      }

      button {
        border: 1px solid #cbd5e1;
        background: #fff;
        color: #111;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }

      .sheet-wrap {
        display: flex;
        justify-content: center;
        padding: 10px;
      }

      .sheet {
        width: 60mm;
        height: 30mm;
        background: #fff;
        border: 1px solid #111;
        border-radius: 4px;
        /* Compensate for printer left non-printable margin */
        padding: 1.4mm 0.8mm 1.2mm 4.6mm;
        display: grid;
        grid-template-columns: 37mm 14.5mm;
        grid-template-rows: 9mm 8.4mm 4.5mm;
        column-gap: 2.6mm;
        row-gap: 0.3mm;
        overflow: visible;
      }

      .name {
        margin: 0;
        grid-column: 1 / 2;
        grid-row: 1 / 2;
        font-size: 2.95mm;
        line-height: 1.1;
        font-weight: 700;
        max-height: 8.6mm;
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .barcode {
        grid-column: 1 / 2;
        grid-row: 2 / 3;
        width: 37mm;
        max-width: 37mm;
        height: 8.4mm;
        object-fit: fill;
      }

      .barcode-value {
        margin-top: 0;
        grid-column: 1 / 2;
        grid-row: 3 / 4;
        width: 37mm;
        text-align: center;
        font-size: 3.1mm;
        font-weight: 700;
        letter-spacing: 0.1mm;
        white-space: nowrap;
        overflow: hidden;
      }

      .price {
        grid-column: 2 / 3;
        grid-row: 2 / 3;
        align-self: start;
        justify-self: end;
        width: auto;
        max-width: none;
        text-align: right;
        font-size: 4.4mm;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
        overflow: visible;
      }

      .number {
        grid-column: 2 / 3;
        grid-row: 3 / 4;
        align-self: start;
        justify-self: end;
        text-align: right;
        font-size: 4.4mm;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
      }

      @media print {
        .toolbar {
          display: none;
        }

        body {
          background: #fff;
        }

        .sheet-wrap {
          padding: 0;
          display: block;
        }

        .sheet {
          border: 0;
          border-radius: 0;
          width: 60mm;
          height: 30mm;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span class="toolbar-title">Print Preview</span>
      <button id="btnPrint" type="button">Print</button>
      <button id="btnClose" type="button">Close</button>
    </div>
    <main class="sheet-wrap">
      <section class="sheet">
        <p class="name" id="labelName"></p>
        <img id="labelBarcode" class="barcode" alt="Barcode" />
        <div id="labelBarcodeValue" class="barcode-value"></div>
        <div id="labelPrice" class="price"></div>
        <div id="labelNumber" class="number"></div>
      </section>
    </main>
    <script src="./print-preview.js"></script>
  </body>
</html>
