<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Preview</title>
    <style>
      @page {
        size: 60mm 30mm;
        margin: 0;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #111;
      }

      .toolbar {
        position: sticky;
        top: 0;
        padding: 10px 14px;
        background: #111827;
        color: #fff;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .toolbar-title {
        font-size: 14px;
        font-weight: 700;
      }

      button {
        border: 1px solid #cbd5e1;
        background: #fff;
        color: #111;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }

      .sheet-wrap {
        display: flex;
        justify-content: center;
        padding: 10px;
      }

      .sheet {
        width: 60mm;
        height: 30mm;
        background: #fff;
        border: 1px solid #111;
        border-radius: 4px;
        padding: 2mm;
        position: relative;
        overflow: hidden;
      }

      .name {
        margin: 0;
        position: absolute;
        left: 2mm;
        top: 1.5mm;
        width: 39mm;
        max-height: 8mm;
        font-size: 3.5mm;
        line-height: 1.1;
        font-weight: 700;
        white-space: normal;
        overflow: hidden;
      }

      .barcode {
        position: absolute;
        left: 2mm;
        top: 11mm;
        width: 36mm;
        max-width: 36mm;
        height: 8mm;
        object-fit: fill;
      }

      .barcode-value {
        margin-top: 0;
        position: absolute;
        left: 2mm;
        top: 20.2mm;
        width: 36mm;
        text-align: center;
        font-size: 2.8mm;
        font-weight: 500;
        letter-spacing: 0.15mm;
      }

      .number {
        position: absolute;
        right: 2mm;
        top: 13.5mm;
        width: 18mm;
        text-align: right;
        font-size: 6.2mm;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
      }

      @media print {
        .toolbar {
          display: none;
        }

        body {
          background: #fff;
        }

        .sheet-wrap {
          padding: 0;
          display: block;
        }

        .sheet {
          border: 0;
          border-radius: 0;
          width: 60mm;
          height: 30mm;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span class="toolbar-title">Print Preview</span>
      <button id="btnPrint" type="button">Print</button>
      <button id="btnClose" type="button">Close</button>
    </div>
    <main class="sheet-wrap">
      <section class="sheet">
        <p class="name" id="labelName"></p>
        <img id="labelBarcode" class="barcode" alt="Barcode" />
        <div id="labelBarcodeValue" class="barcode-value"></div>
        <div id="labelNumber" class="number"></div>
      </section>
    </main>
    <script src="./print-preview.js"></script>
  </body>
</html>
