<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:3791"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Search</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="search-wrap">
        <label for="universal-inventory-search" class="sr-only">Universal Search</label>
        <div class="input-wrap">
          <span class="search-icon">🔎</span>
          <input
            id="universal-inventory-search"
            type="search"
            placeholder="Search all sections by ID, name, category, brand, material..."
            autocomplete="off"
          />
        </div>
        <div id="results-panel" class="results-panel hidden">
          <div id="results-state" class="state-text"></div>
          <div id="results-grid" class="results-grid"></div>
        </div>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
